<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Direct directory registration -->
  <dir>/usr/local/share/fonts/quotegenerator</dir>
  <dir prefix="xdg">fonts/quotegenerator</dir>

  <!-- Match "Caudex Bold" to family "Caudex" with bold weight -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Caudex Bold</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Caudex</string>
    </edit>
    <edit name="weight" mode="assign">
      <const>bold</const>
    </edit>
  </match>

  <!-- Fallback alias for Caudex Bold -->
  <alias>
    <family>Caudex Bold</family>
    <prefer>
      <family>Caudex</family>
    </prefer>
  </alias>

  <!-- Inter aliases -->
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Inter Regular</family>
    </prefer>
  </alias>

  <!-- Baskerville Display PT -->
  <alias>
    <family>Baskerville Display PT</family>
    <prefer>
      <family>Baskerville Display PT</family>
    </prefer>
  </alias>

  <!-- Klein -->
  <alias>
    <family>Klein</family>
    <prefer>
      <family>Klein</family>
    </prefer>
  </alias>

  <!-- Moontime -->
  <alias>
    <family>Moontime</family>
    <prefer>
      <family>Moontime</family>
    </prefer>
  </alias>
</fontconfig>
